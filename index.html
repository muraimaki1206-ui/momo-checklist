<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MOMOジム チェックシート</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #F76C8A;
    --pink-light: #FFD6DF;
    --pink-pale: #FFF0F3;
    --orange: #FF8C42;
    --bg: #FFF8FA;
    --text: #2D1A1F;
    --text-light: #9A7A82;
    --label-w: 200px;
    --cell-w: 38px;
    --row-h: 32px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  .header {
    background: linear-gradient(135deg, var(--pink), var(--orange));
    padding: 10px 14px 8px;
    flex-shrink: 0;
    box-shadow: 0 2px 10px rgba(247,108,138,0.3);
  }
  .header h1 { color: white; font-size: 14px; font-weight: 700; }
  .header-sub { color: rgba(255,255,255,0.85); font-size: 10px; margin-top: 1px; }
  .header-row2 { display: flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .btn-reset {
    background: rgba(255,255,255,0.25); border: 1px solid rgba(255,255,255,0.5);
    color: white; font-family: inherit; font-size: 11px;
    padding: 3px 10px; border-radius: 20px; cursor: pointer;
  }
  .month-input {
    font-family: inherit; font-size: 12px;
    border: 1px solid rgba(255,255,255,0.5); border-radius: 8px;
    padding: 2px 7px; color: white; background: rgba(255,255,255,0.2);
  }
  .month-input:focus { outline: none; }
  .prog-wrap { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .prog-outer { width: 100px; height: 5px; background: rgba(255,255,255,0.3); border-radius: 3px; overflow: hidden; }
  .prog-inner { height: 100%; background: white; border-radius: 3px; transition: width 0.3s; }
  .prog-text { color: white; font-size: 11px; font-weight: 700; white-space: nowrap; }

  /* ── SCROLL AREA ── */
  .grid-outer {
    flex: 1;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* ── CSS GRID ── */
  .grid {
    display: grid;
    grid-template-columns: var(--label-w) repeat(30, var(--cell-w));
    width: max-content;
  }

  /* ── DAY HEADER ── */
  .hdr-label {
    position: sticky; top: 0; left: 0; z-index: 30;
    background: white;
    height: 40px;
    display: flex; align-items: center; padding: 0 8px;
    font-size: 11px; font-weight: 700; color: var(--text-light);
    border-bottom: 2px solid var(--pink-light);
    border-right: 2px solid var(--pink-light);
  }
  .hdr-day {
    position: sticky; top: 0; z-index: 20;
    background: white;
    height: 40px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-bottom: 2px solid var(--pink-light);
    border-right: 1px solid #F0E0E4;
    gap: 1px;
  }
  .hdr-day .dn { font-size: 12px; font-weight: 700; }
  .hdr-day .dw { font-size: 9px; color: var(--text-light); }
  .hdr-day .dw.sun { color: #E84444; }
  .hdr-day .dw.sat { color: #3355CC; }
  .hdr-day.is-today { background: var(--pink-pale); }
  .hdr-day.is-today .dn { color: var(--pink); }

  /* ── SECTION HEADER ── */
  .sec-lbl {
    position: sticky; left: 0; z-index: 15;
    height: 26px;
    display: flex; align-items: center; padding: 0 10px;
    font-size: 11px; font-weight: 700; color: white;
    white-space: nowrap;
    border-bottom: 1px solid rgba(255,255,255,0.2);
  }
  .sec-fill {
    height: 26px;
    border-bottom: 1px solid rgba(255,255,255,0.15);
    border-right: 1px solid rgba(255,255,255,0.1);
  }
  .c-open   { background: #FF4D72; }
  .c-lesson { background: #999; }
  .c-close  { background: #FF8C42; }

  /* ── ITEM ROW ── */
  .row-lbl {
    position: sticky; left: 0; z-index: 10;
    height: var(--row-h);
    display: flex; align-items: center; padding: 0 8px;
    font-size: 11px; line-height: 1.3;
    border-right: 2px solid var(--pink-light);
    border-bottom: 1px solid #F0E0E4;
  }
  .row-cell {
    height: var(--row-h);
    display: flex; align-items: center; justify-content: center;
    border-right: 1px solid #F0E0E4;
    border-bottom: 1px solid #F0E0E4;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    transition: background 0.1s;
  }
  .row-cell:active { transform: scale(0.8); }

  /* Stripe */
  .stripe0 .row-lbl, .stripe0 .row-cell { background: white; }
  .stripe1 .row-lbl, .stripe1 .row-cell { background: #FFF8FA; }

  /* Checked */
  .row-cell.chk.t-open   { background: #FFE0E6; }
  .row-cell.chk.t-lesson { background: #EFEFEF; }
  .row-cell.chk.t-close  { background: #FFE4CC; }

  /* Today col */
  .row-cell.is-today { border-left: 1px solid var(--pink-light); border-right: 1px solid var(--pink-light); }

  /* Check icon */
  .ck {
    font-size: 15px; font-weight: 700;
    opacity: 0; transform: scale(0.3);
    transition: opacity 0.12s, transform 0.12s;
    pointer-events: none;
  }
  .t-open   .ck { color: #E8355A; }
  .t-lesson .ck { color: #555; }
  .t-close  .ck { color: #C46000; }
  .row-cell.chk .ck { opacity: 1; transform: scale(1); }

  /* ── NOTE ── */
  .note {
    grid-column: 1 / -1;
    position: sticky; left: 0;
    padding: 5px 10px;
    font-size: 9px; color: var(--text-light);
    background: var(--pink-pale);
    border-top: 1px solid var(--pink-light);
  }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(50px);
    background: rgba(45,26,31,0.88); color: white;
    font-size: 12px; padding: 7px 16px; border-radius: 20px;
    transition: transform 0.25s; z-index: 999;
    pointer-events: none; white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ── VIEW TABS ── */
  .tabs { display: flex; gap: 6px; margin-top: 6px; }
  .tab {
    background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.5);
    color: white; font-family: inherit; font-size: 11px; font-weight: 700;
    padding: 3px 12px; border-radius: 20px; cursor: pointer;
  }
  .tab.active { background: white; color: var(--pink); }
  .tab .badge {
    display: inline-block; min-width: 16px; margin-left: 4px; padding: 0 4px;
    border-radius: 8px; background: var(--pink); color: white; font-size: 10px; text-align: center;
  }
  .tab:not(.active) .badge { background: rgba(255,255,255,0.9); color: var(--pink); }
  body.view-todo .grid-outer, body.view-todo .header-row2, body.view-todo .header-sub { display: none; }
  body:not(.view-todo) .todo-outer { display: none; }

  /* ── TODO LIST ── */
  .todo-outer { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; padding: 12px 12px 40px; }
  .todo-wrap { max-width: 640px; margin: 0 auto; }
  .todo-add {
    display: flex; gap: 6px; flex-wrap: wrap;
    background: white; border: 1px solid var(--pink-light); border-radius: 12px; padding: 8px;
  }
  .todo-add input {
    font-family: inherit; font-size: 13px; color: var(--text);
    border: 1px solid #F0E0E4; border-radius: 8px; padding: 6px 8px; background: var(--bg);
  }
  .todo-add input:focus { outline: 2px solid var(--pink-light); }
  #todoText { flex: 1 1 200px; min-width: 0; }
  #todoDue { flex: 0 1 150px; }
  .todo-add button {
    font-family: inherit; font-size: 13px; font-weight: 700; color: white;
    background: var(--pink); border: none; border-radius: 8px; padding: 6px 14px; cursor: pointer;
  }
  .todo-group { margin-top: 14px; font-size: 11px; font-weight: 700; color: var(--text-light); padding: 0 4px 4px; }
  .todo-item {
    display: flex; align-items: flex-start; gap: 10px;
    background: white; border: 1px solid #F0E0E4; border-radius: 12px;
    padding: 10px 10px; margin-top: 6px;
  }
  .todo-check {
    flex-shrink: 0; width: 22px; height: 22px; margin-top: 1px;
    border: 2px solid var(--pink); border-radius: 50%; background: white;
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 13px; font-weight: 700; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .todo-item.done .todo-check { background: var(--pink); }
  .todo-body { flex: 1; min-width: 0; }
  .todo-title { font-size: 13px; line-height: 1.5; word-break: break-word; }
  .todo-item.done .todo-title { text-decoration: line-through; color: var(--text-light); }
  .todo-due {
    display: inline-block; margin-top: 3px; font-size: 10px; font-weight: 700;
    color: var(--orange); background: #FFF1E6; border-radius: 6px; padding: 1px 7px;
  }
  .todo-due.over { color: white; background: #E84444; }
  .todo-item.done .todo-due { color: var(--text-light); background: #F3EEEF; }
  .todo-del {
    flex-shrink: 0; background: none; border: none; color: #C9B3B9;
    font-size: 16px; line-height: 1; cursor: pointer; padding: 2px 4px;
  }
  .todo-empty { text-align: center; color: var(--text-light); font-size: 12px; margin-top: 30px; }
</style>
</head>
<body>

<div class="header">
  <h1>🏋️ MOMOジム　オープン・クローズ チェックシート</h1>
  <div class="tabs">
    <button class="tab active" id="tabCheck" onclick="setView('check')">✅ チェックシート</button>
    <button class="tab" id="tabTodo" onclick="setView('todo')">📝 やることリスト<span class="badge" id="todoBadge"></span></button>
  </div>
  <div class="header-sub">作業項目をタップしてチェック ✓</div>
  <div class="header-row2">
    <button class="btn-reset" onclick="confirmReset()">🔄 リセット</button>
    <input type="month" class="month-input" id="monthPicker">
    <div class="prog-wrap">
      <div class="prog-outer"><div class="prog-inner" id="progBar" style="width:0%"></div></div>
      <div class="prog-text" id="progText">0%</div>
    </div>
  </div>
</div>

<div class="grid-outer">
  <div class="grid" id="grid"></div>
</div>

<div class="todo-outer">
  <div class="todo-wrap">
    <form class="todo-add" onsubmit="addTodo(event)">
      <input type="text" id="todoText" placeholder="やることを入力" autocomplete="off">
      <input type="date" id="todoDue" title="期限（任意）">
      <button type="submit">追加</button>
    </form>
    <div id="todoList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORE  = 'momo_ck_v3';
const MSTORE = 'momo_month_v3';
const DAYS   = ['日','月','火','水','木','金','土'];

const SECTIONS = [
  { id:'open', label:'▼ オープン作業　9:00〜9:15', items:[
    '① シャッターをあける',
    '② ヨガマット・トレー・ツールをセット',
    '③ トイレ：便座ON・ゴミ箱を空に・ペーパー三角折り・スリッパをそろえる',
    '④ トイレ：便器ブラシ掃除・便座ふた・床シートで拭く',
    '⑤ 外の掃き掃除・お花の水やり',
    '⑥ 消毒台・手すり・看板・チラシ入れ・靴おきを拭く',
    '都度：チラシ補充（なければ補充する）',
    '都度：加湿器の水補給 / 除湿機の水を捨てる',
    '【電気】エアコン・換気扇・空清1台・ステレオ ON',
  ]},
  { id:'lesson', label:'▼ レッスン終了後（各レッスン後に実施）', items:[
    '① 使用ツール・マット：消毒液で拭いて片付ける',
    '② 窓をしめる',
    '③ 電気・換気扇・エアコン・空清をオフにする',
    '④ 入り口を施錠する',
  ]},
  { id:'close', label:'▼ クローズ作業（夜のレッスンがない場合）', items:[
    '① トイレのゴミをゴミ箱に入れる',
    '② ルンバをかける（スリッパを靴おきに重しとして乗せる）',
    '③ トイレの便座の電気を消す',
    '④ シャッターを閉める',
  ]},
];

let data = {};
let yr, mo;

function load() {
  try { data = JSON.parse(localStorage.getItem(STORE)||'{}'); } catch { data={}; }
}
function save() { localStorage.setItem(STORE, JSON.stringify(data)); }

function initMonth() {
  const now = new Date();
  const saved = localStorage.getItem(MSTORE) || `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  document.getElementById('monthPicker').value = saved;
  setMonth(saved);
}

function setMonth(val) {
  [yr, mo] = val.split('-').map(Number);
  localStorage.setItem(MSTORE, val);
  buildGrid();
}

function todayDay() {
  const n = new Date();
  return (n.getFullYear()===yr && n.getMonth()+1===mo) ? n.getDate() : -1;
}

function k(sid, ii, d) { return `${sid}_${ii}_${d}`; }

function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const today = todayDay();

  // Day header
  const hl = el('div', 'hdr-label', '作業内容');
  grid.appendChild(hl);
  for (let d = 1; d <= 30; d++) {
    const date = new Date(yr, mo-1, d);
    const dow  = date.getDay();
    const hd   = el('div', 'hdr-day' + (d===today?' is-today':''));
    hd.innerHTML = `<span class="dn">${d}</span><span class="dw ${dow===0?'sun':dow===6?'sat':''}">${DAYS[dow]}</span>`;
    grid.appendChild(hd);
  }

  // Sections
  SECTIONS.forEach(sec => {
    // Section label
    grid.appendChild(el('div', `sec-lbl c-${sec.id}`, sec.label));
    for (let d = 1; d <= 30; d++) grid.appendChild(el('div', `sec-fill c-${sec.id}`));

    // Items
    sec.items.forEach((item, ii) => {
      const stripe = `stripe${ii%2}`;
      const rl = el('div', `row-lbl ${stripe}`, item);
      grid.appendChild(rl);

      for (let d = 1; d <= 30; d++) {
        const key = k(sec.id, ii, d);
        const cls = `row-cell t-${sec.id} ${stripe}${d===today?' is-today':''}${data[key]?' chk':''}`;
        const rc  = el('div', cls);
        rc.dataset.k = key;
        rc.innerHTML = '<span class="ck">✓</span>';
        rc.addEventListener('click', onTap);
        grid.appendChild(rc);
      }
    });
  });

  // Note
  grid.appendChild(el('div', 'note', '※ リモコンが共通のためエアコンが2台稼働している場合あり。要確認。'));
  updateProg();
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function onTap(e) {
  const rc = e.currentTarget;
  const key = rc.dataset.k;
  if (data[key]) { delete data[key]; rc.classList.remove('chk'); }
  else           { data[key]=1; rc.classList.add('chk'); showToast('✓ チェックしました'); }
  save(); updateProg();
}

function updateProg() {
  const total = SECTIONS.reduce((s,sec)=>s+sec.items.length,0)*30;
  const done  = Object.keys(data).length;
  const pct   = Math.round(done/total*100);
  document.getElementById('progBar').style.width = pct+'%';
  document.getElementById('progText').textContent = `${done}/${total} (${pct}%)`;
}

function confirmReset() {
  if (confirm('チェックデータをすべてリセットしますか？')) {
    data={}; save(); buildGrid(); showToast('🔄 リセットしました');
  }
}

let toastT;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(()=>t.classList.remove('show'), 1400);
}

document.getElementById('monthPicker').addEventListener('change', e=>setMonth(e.target.value));
load();
initMonth();

// ── やることリスト ──
const TSTORE = 'momo_todo_v1';
const VSTORE = 'momo_view_v1';
// 初期登録のやること（id で管理し、未登録のものだけ追加される）
const DEFAULT_TODOS = [
  { id:'d_2027_calendar', text:'来年（2027年）の年間予定と1〜3月のカレンダーを作る', due:'2026-12-10', dueLabel:'2026年12月上旬' },
];

let todos = [];
function loadTodos() {
  let st;
  try { st = JSON.parse(localStorage.getItem(TSTORE)||'null'); } catch { st = null; }
  if (!st || !Array.isArray(st.items)) st = { items:[], seeded:[] };
  DEFAULT_TODOS.forEach(d => {
    if (!st.seeded.includes(d.id)) { st.items.push({ ...d, done:false }); st.seeded.push(d.id); }
  });
  todos = st.items; todoSeeded = st.seeded;
  saveTodos();
}
let todoSeeded = [];
function saveTodos() { localStorage.setItem(TSTORE, JSON.stringify({ items:todos, seeded:todoSeeded })); }

function todayStr() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
}
function fmtDue(t) {
  if (t.dueLabel) return t.dueLabel;
  const [y,m,d] = t.due.split('-').map(Number);
  return `${y}年${m}月${d}日（${DAYS[new Date(y,m-1,d).getDay()]}）`;
}

function renderTodos() {
  const list = document.getElementById('todoList');
  list.innerHTML = '';
  const byDue = (a,b) => (a.due||'9999') < (b.due||'9999') ? -1 : (a.due||'9999') > (b.due||'9999') ? 1 : 0;
  const open = todos.filter(t=>!t.done).sort(byDue);
  const done = todos.filter(t=>t.done).sort(byDue);
  const badge = document.getElementById('todoBadge');
  badge.textContent = open.length || '';
  badge.style.display = open.length ? '' : 'none';

  if (!todos.length) { list.appendChild(el('div','todo-empty','やることはまだありません')); return; }
  const today = todayStr();
  const group = (title, arr) => {
    if (!arr.length) return;
    list.appendChild(el('div','todo-group', `${title}（${arr.length}）`));
    arr.forEach(t => {
      const row = el('div', 'todo-item' + (t.done?' done':''));
      const ck = el('div','todo-check', t.done ? '✓' : '');
      ck.addEventListener('click', () => {
        t.done = !t.done; saveTodos(); renderTodos();
        if (t.done) showToast('✓ 完了しました');
      });
      const body = el('div','todo-body');
      body.appendChild(el('div','todo-title', t.text));
      if (t.due) body.appendChild(el('span', 'todo-due' + (!t.done && t.due < today ? ' over' : ''), '📅 ' + fmtDue(t)));
      const del = el('button','todo-del','×');
      del.title = '削除';
      del.addEventListener('click', () => {
        if (confirm(`「${t.text}」を削除しますか？`)) {
          todos = todos.filter(x=>x!==t); saveTodos(); renderTodos(); showToast('🗑 削除しました');
        }
      });
      row.append(ck, body, del);
      list.appendChild(row);
    });
  };
  group('未完了', open);
  group('完了', done);
}

function addTodo(e) {
  e.preventDefault();
  const ti = document.getElementById('todoText'), di = document.getElementById('todoDue');
  const text = ti.value.trim();
  if (!text) { ti.focus(); return; }
  todos.push({ id:'u_'+Date.now(), text, due: di.value || '', done:false });
  saveTodos(); renderTodos();
  ti.value = ''; di.value = '';
  showToast('📝 追加しました');
}

function setView(v) {
  document.body.classList.toggle('view-todo', v==='todo');
  document.getElementById('tabCheck').classList.toggle('active', v!=='todo');
  document.getElementById('tabTodo').classList.toggle('active', v==='todo');
  localStorage.setItem(VSTORE, v);
}

loadTodos();
renderTodos();
setView(localStorage.getItem(VSTORE) || 'check');
</script>
</body>
</html>
