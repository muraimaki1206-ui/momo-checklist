<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>体力向上＆ランチ忘年会 バナー</title>
<style>
  :root { --rose:#A94566; --rose-lt:#F6D5DE; --cream:#FAF3EE; --green:#3F5A3C; --ink:#1E1717; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1080px; height:1080px; }
  body { font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic','WenQuanYi Zen Hei',sans-serif; font-weight:900; color:var(--ink); background:var(--cream); overflow:hidden; position:relative; }
  .dot { position:absolute; border-radius:50%; }
  .top { position:absolute; left:0; right:0; top:0; height:150px; background:var(--rose); color:#fff; text-align:center; padding-top:34px; }
  .top small { display:block; font-size:26px; letter-spacing:.5em; font-weight:700; opacity:.95; }
  .top b { display:block; font-size:50px; margin-top:6px; letter-spacing:.06em; }
  .title { position:absolute; left:0; right:0; top:172px; text-align:center; }
  .title .l1 { font-size:150px; line-height:1.05; letter-spacing:.04em; }
  .title .l2 { font-size:92px; line-height:1.2; margin-top:4px; color:var(--rose); }
  .card { position:absolute; left:110px; right:110px; top:478px; height:236px; background:#fff; border:6px solid var(--ink); border-radius:34px; text-align:center; padding-top:22px; }
  .card .d { font-size:112px; line-height:1.1; }
  .card .d span { font-size:58px; margin-left:8px; }
  .card .t { font-size:62px; line-height:1.2; margin-top:4px; }
  .place { position:absolute; left:0; right:0; top:742px; text-align:center; }
  .place span { display:inline-block; background:var(--green); color:#fff; font-size:50px; border-radius:50px; padding:8px 54px; }
  .chips { position:absolute; left:80px; right:80px; top:848px; display:flex; gap:24px; justify-content:center; }
  .chip { flex:1; background:var(--rose-lt); border-radius:30px; text-align:center; padding:10px 0 8px; font-size:40px; }
  .chip svg { width:72px; height:72px; display:block; margin:0 auto 2px; }
  .foot { position:absolute; left:0; right:0; bottom:16px; text-align:center; font-size:36px; color:var(--green); letter-spacing:.04em; }
</style>
</head>
<body>
  <!-- 紙吹雪 -->
  <div class="dot" style="left:60px;top:200px;width:44px;height:44px;background:#F3B8C6"></div>
  <div class="dot" style="right:70px;top:230px;width:30px;height:30px;background:#BFD3BB"></div>
  <div class="dot" style="left:130px;top:470px;width:26px;height:26px;background:#BFD3BB"></div>
  <div class="dot" style="right:110px;top:480px;width:50px;height:50px;background:#F3B8C6"></div>
  <div class="dot" style="left:40px;top:760px;width:34px;height:34px;background:#F3B8C6"></div>
  <div class="dot" style="right:40px;top:740px;width:36px;height:36px;background:#BFD3BB"></div>

  <div class="top"><small>MOMO GYM</small><b>年末スペシャル</b></div>

  <div class="title">
    <div class="l1">体力向上</div>
    <div class="l2">＆ ランチ忘年会</div>
  </div>

  <div class="card">
    <div class="d">12/26<span>（土）</span></div>
    <div class="t">12:30〜14:30</div>
  </div>
  <div class="place"><span>＠ モモジム</span></div>

  <div class="chips">
    <div class="chip">
      <svg viewBox="0 0 64 64" fill="none" stroke="#A94566" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="12" r="6" fill="#F6D5DE"/><path d="M32 18v18M32 24l-14-8M32 24l14-8M32 36l-10 18M32 36l10 18"/></svg>
      運動
    </div>
    <div class="chip">
      <svg viewBox="0 0 64 64" fill="none" stroke="#A94566" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="32" cy="26" rx="16" ry="19" fill="#F6D5DE"/><path d="M32 45l-3 6h6l-3-6M32 51c0 5-6 6-6 10"/></svg>
      遊び
    </div>
    <div class="chip">
      <svg viewBox="0 0 64 64" fill="none" stroke="#3F5A3C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="34" r="22" fill="#fff"/><circle cx="32" cy="34" r="12"/><path d="M8 8v18M13 8v18M18 8v18M8 20h10M56 8c-4 4-4 12 0 16v-16"/></svg>
      ランチ
    </div>
  </div>

  <div class="foot">今年をみんなで、笑って締めくくろう</div>
</body>
</html>
