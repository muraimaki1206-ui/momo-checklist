<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><style>
:root{--rose:#A94566;--rose-lt:#F6D5DE;--cream:#FAF3EE;--green:#3F5A3C;--ink:#1E1717;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:800px;height:800px}
body{font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic','WenQuanYi Zen Hei',sans-serif;font-weight:900;color:var(--ink);background:var(--cream);position:relative;overflow:hidden}
.ring{position:absolute;left:50px;top:50px;width:700px;height:700px;border-radius:50%;background:#fff;border:14px solid var(--rose)}
.ring2{position:absolute;left:84px;top:84px;width:632px;height:632px;border-radius:50%;border:4px dashed var(--rose-lt)}
.c{position:absolute;left:0;right:0;text-align:center}
.brand{top:128px;font-size:28px;letter-spacing:.45em;color:var(--green);font-weight:700}
.small{font-size:54px;color:var(--rose)}
.big{font-size:100px;line-height:1.1;color:var(--ink)}
.sub{font-size:36px;color:var(--green);font-weight:700}
.dot{position:absolute;border-radius:50%}
.nums{display:flex;gap:18px;justify-content:center}
.nums span{width:68px;height:68px;border-radius:50%;background:var(--rose);color:#fff;font-size:40px;display:grid;place-items:center}
svg{position:absolute}
</style></head><body>
<div class="ring"></div><div class="ring2"></div>
<div class="dot" style="left:40px;top:120px;width:36px;height:36px;background:#F3B8C6"></div>
<div class="dot" style="right:44px;top:160px;width:26px;height:26px;background:#BFD3BB"></div>
<div class="dot" style="left:70px;bottom:130px;width:24px;height:24px;background:#BFD3BB"></div>
<div class="dot" style="right:60px;bottom:110px;width:40px;height:40px;background:#F3B8C6"></div>
<div class="c brand">MOMO GYM</div>
<div class="c" style="top:200px"><div class="nums"><span>1</span><span>2</span><span>3</span><span>4</span></div></div><div class="c big" style="top:310px">全部<br>できた！</div><div class="c sub" style="top:600px">今日の4つ、ぜんぶクリア</div><svg viewBox="0 0 64 64" width="90" height="90" style="left:100px;top:300px" fill="#F2B544" stroke="#A94566" stroke-width="3" stroke-linejoin="round"><path d="M32 5l8 18 19 2-14 13 4 19-17-10-17 10 4-19L5 25l19-2z"/></svg><svg viewBox="0 0 64 64" width="90" height="90" style="left:610px;top:300px" fill="#F2B544" stroke="#A94566" stroke-width="3" stroke-linejoin="round"><path d="M32 5l8 18 19 2-14 13 4 19-17-10-17 10 4-19L5 25l19-2z"/></svg>
</body></html>
